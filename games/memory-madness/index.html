</style></head><body><div class="wrap"><header><span class="brand">👑 STASHUNARY KIDS</span><a href="../../kids-games.html">← All Games</a></header><div class="hero"><h1>🧠 MEMORY<br>MADNESS!</h1><p class="sub">Flip it. Match it. Win it! 🌟</p></div>
<section class="panel"><div class="setup"><label class="group">DIFFICULTY<select id="level"><option value="easy">Easy · 6 pairs</option><option value="medium" selected>Medium · 8 pairs</option><option value="hard">Hard · 10 pairs</option></select></label><label class="group">PLAY MODE<select id="mode"><option value="solo">Solo</option><option value="duo">2 players · same device</option></select></label><button class="primary" id="new">🎮 New Game</button></div><div class="stats"><div class="stat"><b id="moves">0</b><small>TRIES</small></div><div class="stat"><b id="pairs">0/8</b><small>PAIRS FOUND</small></div><div class="stat"><b id="timer">0:00</b><small>TIME</small></div></div><div class="status" id="status" role="status" aria-live="polite">Find two matching cards!</div><div id="board" class="board" aria-label="Memory matching cards"></div><div id="winner" class="winner" role="status" aria-live="polite"><div class="confetti">🎉🏆🎉</div><h2 id="winTitle">YOU DID IT!</h2><p id="winDetails"></p><button class="primary" id="again">🔁 Play Again</button></div></section><div class="foot">Made for curious minds 💜 Free to play • No account needed</div></div>
<script>
(()=>{'use strict';
const icons=['🦄','🚀','🦖','🐼','🌈','🦋','🍕','⭐','🐸','🎸'];const $=id=>document.getElementById(id);
let cards=[],first=null,second=null,locked=false,moves=0,matched=0,turn=0,scores=[0,0],started=0,elapsed=0,interval=null,token=0;
const duo=()=>$('mode').value==='duo';const names=['Player 1','Player 2'];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clock(){const s=Math.floor(elapsed/1000);$('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function stop(){if(interval)clearInterval(interval);interval=null}
function beginClock(){if(interval)return;started=Date.now()-elapsed;interval=setInterval(()=>{elapsed=Date.now()-started;clock()},250)}
function status(){if(duo())$('status').textContent=names[turn]+'’s turn · ⭐ '+scores[0]+' — '+scores[1];else $('status').textContent='Find two matching cards! 🌟'}
function paint(){const board=$('board');board.innerHTML='';board.classList.toggle('hard',cards.length===20);cards.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='tile'+(c.open?' open':'')+(c.matched?' matched':'');b.disabled=c.matched;b.setAttribute('aria-label',c.matched?'Matched card':c.open?'Revealed '+c.icon:'Hidden card '+(i+1));b.innerHTML='<span class="inner"><span class="face back" aria-hidden="true">?</span><span class="face front" aria-hidden="true">'+c.icon+'</span></span>';b.addEventListener('click',()=>flip(i));board.appendChild(b)})}
function refresh(){ $('moves').textContent=moves;$('pairs').textContent=matched+'/'+(cards.length/2);status()}
function win(){stop();locked=true;const title=duo()?(scores[0]===scores[1]?'IT’S A TIE! 🤝':names[scores[0]>scores[1]?0:1]+' WINS! 🏆'):'MEMORY MASTER! 🏆';$('winTitle').textContent=title;$('winDetails').textContent=duo()?names[0]+': '+scores[0]+' pairs • '+names[1]+': '+scores[1]+' pairs • '+moves+' tries':matched+' pairs in '+moves+' tries and '+$('timer').textContent;$('winner').classList.add('show');$('status').textContent='Amazing job! 🎉'}
function flip(i){if(locked||cards[i].open||cards[i].matched)return;beginClock();cards[i].open=true;paint();if(first===null){first=i;return}second=i;moves++;refresh();locked=true;const thisToken=token;const a=first,b=second;if(cards[a].icon===cards[b].icon){setTimeout(()=>{if(thisToken!==token)return;cards[a].matched=cards[b].matched=true;matched++;if(duo())scores[turn]++;first=second=null;locked=false;paint();refresh();if(matched===cards.length/2)win()},420)}else{setTimeout(()=>{if(thisToken!==token)return;cards[a].open=cards[b].open=false;first=second=null;if(duo())turn=1-turn;locked=false;paint();refresh()},850)}}
function reset(){token++;stop();elapsed=0;clock();first=second=null;locked=false;moves=matched=turn=0;scores=[0,0];$('winner').classList.remove('show');const count={easy:6,medium:8,hard:10}[$('level').value];cards=shuffle(icons.slice(0,count).flatMap(icon=>[{icon,open:false,matched:false},{icon,open:false,matched:false}]));paint();refresh()}
$('new').addEventListener('click',reset);$('again').addEventListener('click',reset);$('mode').addEventListener('change',reset);$('level').addEventListener('change',reset);reset();
})();
</script></body></html>
