</style></head><body><div class="wrap"><header><a href="../../kids-games.html">← KIDS ARCADE</a><span class="brand">👑 STASHUNARY</span></header><div class="eyebrow">✦ THE STASHUNARY KIDS ARCADE ✦</div><h1><span>NUMBER</span><br><em>GOBBLERS!</em></h1><div class="spark spark1">✦</div><div class="spark spark2">★</div><div class="spark spark3">✧</div><p class="sub">🍭 Crunch the numbers. Feed the fun! 🍭</p><div class="panel"><div class="panel-glow"></div><div class="controls"><label>CHALLENGE<select id="level"><option value="easy">Little Bites · Add to 10</option><option value="medium">Big Bites · Add & Subtract to 20</option><option value="hard">Mega Bites · Mixed Math</option></select></label><button class="primary" id="new">↻ NEW GAME</button></div><div class="stats"><div class="stat"><strong id="score">0</strong><small>POINTS</small></div><div class="stat"><strong id="round">1 / 10</strong><small>QUESTION</small></div><div class="stat"><strong id="streak">0 🔥</strong><small>STREAK</small></div></div><section id="play" class="arena" aria-live="polite"><div class="monster-stage"><span class="orbit orbit-a">⭐</span><span class="orbit orbit-b">🍬</span><span class="orbit orbit-c">✨</span><span id="monster" class="monster" role="img" aria-label="Smiling purple monster with three eyes"><svg viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><radialGradient id="fur" cx="35%" cy="22%" r="75%"><stop stop-color="#ff9cff"/><stop offset=".42" stop-color="#bf48e9"/><stop offset="1" stop-color="#6520a9"/></radialGradient><linearGradient id="horn" x2=".8" y2="1"><stop stop-color="#ffed8d"/><stop offset="1" stop-color="#ff8a40"/></linearGradient></defs><ellipse cx="130" cy="200" rx="85" ry="13" fill="#170536" opacity=".45"/><path d="M62 63 46 10 102 52M158 49 214 9 202 82" fill="url(#horn)" stroke="#4e176b" stroke-width="7" stroke-linejoin="round"/><path d="M29 130C18 74 58 40 124 36c78-6 120 35 113 103-5 49-40 70-108 70C67 209 34 183 29 130Z" fill="url(#fur)" stroke="#48106c" stroke-width="7"/><path d="M43 139 13 124 18 148 44 155M218 139l28-19-2 30-25 9" fill="#9b36d6" stroke="#48106c" stroke-width="5"/><ellipse cx="85" cy="107" rx="26" ry="31" fill="white"/><ellipse cx="174" cy="107" rx="26" ry="31" fill="white"/><ellipse cx="130" cy="76" rx="18" ry="20" fill="white"/><circle cx="92" cy="111" r="12" fill="#26124c"/><circle cx="167" cy="111" r="12" fill="#26124c"/><circle cx="130" cy="79" r="8" fill="#26124c"/><circle cx="96" cy="106" r="4" fill="white"/><circle cx="171" cy="106" r="4" fill="white"/><path d="M80 151Q130 205 183 151Q131 163 80 151Z" fill="#42135c" stroke="#4c1764" stroke-width="5"/><path d="m100 156 9 15 9-12m23 0 9 12 10-15" fill="white" stroke="white" stroke-linejoin="round" stroke-width="3"/><ellipse cx="57" cy="143" rx="12" ry="7" fill="#ff76bd" opacity=".7"/><ellipse cx="204" cy="143" rx="12" ry="7" fill="#ff76bd" opacity=".7"/><path d="M65 45 58 28M196 44l9-17" stroke="#fff2a2" stroke-width="6" stroke-linecap="round"/></svg></span></div><div><div id="question" class="bubble">Ready?</div></div><div class="choose">👇 TAP THE TASTIEST ANSWER 👇</div><div class="answers" id="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div></section><section id="finish" class="finish" aria-live="polite"><div style="font-size:85px">🏆👾🎉</div><h2 id="finishTitle">MONSTER FED!</h2><p id="finishText"></p><button class="primary" id="again">PLAY AGAIN ↻</button></section><p class="hint">10 questions per game • No account needed • Free to play</p></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id);let score=0,streak=0,round=0,answer=0,locked=false,timer=null;const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function question(){const level=$('level').value;let a,b,op;if(level==='easy'){a=rand(0,10);b=rand(0,10-a);op='+'}else if(level==='medium'){op=Math.random()<.5?'+':'−';if(op==='+'){a=rand(0,20);b=rand(0,20-a)}else{a=rand(1,20);b=rand(0,a)}}else{op=['+','−','×'][rand(0,2)];if(op==='×'){a=rand(1,10);b=rand(1,10)}else if(op==='+'){a=rand(5,30);b=rand(1,30)}else{a=rand(5,40);b=rand(0,a)}}answer=op==='+'?a+b:op==='−'?a-b:a*b;$('question').textContent=a+' '+op+' '+b+' = ?';let opts=new Set([answer]);let tries=0;while(opts.size<4&&tries++<100){let delta=rand(-10,10);if(delta===0)continue;let v=answer+delta;if(v>=0)opts.add(v)}while(opts.size<4)opts.add(answer+opts.size+1);let shuffled=[...opts].sort(()=>Math.random()-.5);$('answers').replaceChildren(...shuffled.map(v=>{let btn=document.createElement('button');btn.className='answer';btn.textContent=v;btn.setAttribute('aria-label','Answer '+v);btn.addEventListener('click',()=>choose(v));return btn}));$('feedback').textContent='Pick the yummy answer!';locked=false;$('round').textContent=(round+1)+' / 10'}function choose(v){if(locked)return;locked=true;const correct=v===answer;if(correct){streak++;score+=10+(streak>1?5:0);$('feedback').textContent=['YUM YUM! 🌟','DELICIOUS! 🎉','SUPER SMART! ⭐'][rand(0,2)]}else{streak=0;$('feedback').textContent='Oops! The answer was '+answer+' 💜'}$('score').textContent=score;$('streak').textContent=streak+' 🔥';$('monster').className='monster '+(correct?'chew':'ouch');$('answers').querySelectorAll('button').forEach(b=>b.disabled=true);round++;timer=setTimeout(()=>{if(round===10)finish();else{$('monster').className='monster';question()}},1000)}function finish(){$('play').classList.add('hide');$('finish').classList.add('show');$('finishTitle').textContent=score>=125?'SUPER GOBBLER! 🏆':score>=80?'MONSTER FED! 🎉':'KEEP GOBBLING! 💜';$('finishText').textContent='You scored '+score+' points in 10 questions! Every try makes your brain stronger.'}function reset(){clearTimeout(timer);score=0;streak=0;round=0;$('score').textContent='0';$('streak').textContent='0 🔥';$('monster').className='monster';$('play').classList.remove('hide');$('finish').classList.remove('show');question()}$('new').addEventListener('click',reset);$('again').addEventListener('click',reset);$('level').addEventListener('change',reset);reset()})();</script></body></html>
