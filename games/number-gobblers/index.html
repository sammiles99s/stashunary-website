<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#35115c"><title>Number Gobblers! | STASHUNARY Kids Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0%,#a345db,#4b177d 48%,#190b38 100%)}.wrap{max-width:760px;margin:auto;padding:15px 16px 55px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:900;font-size:13px}a{color:#ffe37b;text-decoration:none}.brand{letter-spacing:.09em;color:#ffdc65}h1{text-align:center;font-size:clamp(38px,9vw,70px);line-height:1;margin:15px 0 7px;color:#ffde61;text-shadow:0 5px #d34099,0 9px #44145c}.sub{text-align:center;margin:0 0 17px;color:#ffe6ff}.panel{background:#260d51cc;border:2px solid #c884fa;border-radius:23px;padding:16px;box-shadow:0 12px 32px #10042577}.controls{display:flex;justify-content:center;align-items:end;gap:10px;flex-wrap:wrap}label{font-weight:850;font-size:12px;color:#f6ddff;display:grid;gap:5px}select{min-height:46px;padding:9px;border:2px solid #ffdc66;border-radius:12px;color:white;background:#39146a;font-weight:800;font-size:15px}button{font:inherit;cursor:pointer}.primary{background:linear-gradient(125deg,#ffe66e,#ff974b);color:#401354;font-weight:1000;border:0;border-radius:13px;padding:12px 20px;min-height:46px;box-shadow:0 5px #ad5b3b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.stat{background:#240d49;border:1px solid #b887ef;border-radius:13px;text-align:center;padding:10px 3px}.stat strong{display:block;font-size:25px;color:#ffe66e}.stat small{font-size:11px;color:#edd3ff}.arena{text-align:center;position:relative;overflow:hidden}.monster{font-size:clamp(95px,25vw,160px);display:block;line-height:1.1;filter:drop-shadow(0 12px 4px #0005);transform-origin:center;transition:transform .18s}.monster.chew{animation:chew .45s ease}.monster.ouch{animation:ouch .4s ease}@keyframes chew{0%,100%{transform:scale(1)}40%{transform:scale(1.22) rotate(-6deg)}70%{transform:scale(.9) rotate(6deg)}}@keyframes ouch{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}.bubble{display:inline-block;background:#fff;color:#40105f;border:4px solid #ffde6b;border-radius:24px;padding:13px 19px;font-size:clamp(19px,5vw,28px);font-weight:1000;box-shadow:0 7px #3b1355;margin:6px auto 16px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:520px;margin:0 auto}.answer{min-height:83px;border:3px solid #fff8;border-radius:20px;color:#fff;font-size:clamp(30px,8vw,46px);font-weight:1000;box-shadow:0 7px #14052977;touch-action:manipulation}.answer:nth-child(4n+1){background:linear-gradient(140deg,#ff60a6,#c92f9d)}.answer:nth-child(4n+2){background:linear-gradient(140deg,#24d9e3,#1279c3)}.answer:nth-child(4n+3){background:linear-gradient(140deg,#a8dc42,#419f4a)}.answer:nth-child(4n+4){background:linear-gradient(140deg,#ffb33f,#e46734)}.answer:disabled{opacity:.7;cursor:default}.feedback{min-height:33px;font-weight:1000;color:#ffe66e;font-size:21px;margin:14px 0}.hint{font-size:13px;color:#e5c6ff;text-align:center;margin-top:17px}.finish{display:none;text-align:center;margin:12px auto;max-width:540px}.finish.show{display:block}.finish h2{font-size:33px;color:#ffdf64}.finish p{font-size:19px;line-height:1.5}.hide{display:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><div class="wrap"><header><a href="../../kids-games.html">← KIDS ARCADE</a><span class="brand">👑 STASHUNARY</span></header><h1>NUMBER<br>GOBBLERS! 👾</h1><p class="sub">Feed the monster the right answer!</p><div class="panel"><div class="controls"><label>CHALLENGE<select id="level"><option value="easy">Little Bites · Add to 10</option><option value="medium">Big Bites · Add & Subtract to 20</option><option value="hard">Mega Bites · Mixed Math</option></select></label><button class="primary" id="new">↻ NEW GAME</button></div><div class="stats"><div class="stat"><strong id="score">0</strong><small>POINTS</small></div><div class="stat"><strong id="round">1 / 10</strong><small>QUESTION</small></div><div class="stat"><strong id="streak">0 🔥</strong><small>STREAK</small></div></div><section id="play" class="arena" aria-live="polite"><span id="monster" class="monster" role="img" aria-label="Happy hungry monster">👾</span><div><div id="question" class="bubble">Ready?</div></div><div class="answers" id="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div></section><section id="finish" class="finish" aria-live="polite"><div style="font-size:85px">🏆👾🎉</div><h2 id="finishTitle">MONSTER FED!</h2><p id="finishText"></p><button class="primary" id="again">PLAY AGAIN ↻</button></section><p class="hint">10 questions per game • No account needed • Free to play</p></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id);let score=0,streak=0,round=0,answer=0,locked=false,timer=null;const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function question(){const level=$('level').value;let a,b,op;if(level==='easy'){a=rand(0,10);b=rand(0,10-a);op='+'}else if(level==='medium'){op=Math.random()<.5?'+':'−';if(op==='+'){a=rand(0,20);b=rand(0,20-a)}else{a=rand(1,20);b=rand(0,a)}}else{op=['+','−','×'][rand(0,2)];if(op==='×'){a=rand(1,10);b=rand(1,10)}else if(op==='+'){a=rand(5,30);b=rand(1,30)}else{a=rand(5,40);b=rand(0,a)}}answer=op==='+'?a+b:op==='−'?a-b:a*b;$('question').textContent=a+' '+op+' '+b+' = ?';let opts=new Set([answer]);let tries=0;while(opts.size<4&&tries++<100){let delta=rand(-10,10);if(delta===0)continue;let v=answer+delta;if(v>=0)opts.add(v)}while(opts.size<4)opts.add(answer+opts.size+1);let shuffled=[...opts].sort(()=>Math.random()-.5);$('answers').replaceChildren(...shuffled.map(v=>{let btn=document.createElement('button');btn.className='answer';btn.textContent=v;btn.setAttribute('aria-label','Answer '+v);btn.addEventListener('click',()=>choose(v));return btn}));$('feedback').textContent='Pick the yummy answer!';locked=false;$('round').textContent=(round+1)+' / 10'}function choose(v){if(locked)return;locked=true;const correct=v===answer;if(correct){streak++;score+=10+(streak>1?5:0);$('feedback').textContent=['YUM YUM! 🌟','DELICIOUS! 🎉','SUPER SMART! ⭐'][rand(0,2)]}else{streak=0;$('feedback').textContent='Oops! The answer was '+answer+' 💜'}$('score').textContent=score;$('streak').textContent=streak+' 🔥';$('monster').className='monster '+(correct?'chew':'ouch');$('answers').querySelectorAll('button').forEach(b=>b.disabled=true);round++;timer=setTimeout(()=>{if(round===10)finish();else{$('monster').className='monster';question()}},1000)}function finish(){$('play').classList.add('hide');$('finish').classList.add('show');$('finishTitle').textContent=score>=125?'SUPER GOBBLER! 🏆':score>=80?'MONSTER FED! 🎉':'KEEP GOBBLING! 💜';$('finishText').textContent='You scored '+score+' points in 10 questions! Every try makes your brain stronger.'}function reset(){clearTimeout(timer);score=0;streak=0;round=0;$('score').textContent='0';$('streak').textContent='0 🔥';$('monster').className='monster';$('play').classList.remove('hide');$('finish').classList.remove('show');question()}$('new').addEventListener('click',reset);$('again').addEventListener('click',reset);$('level').addEventListener('change',reset);reset()})();</script></body></html>
