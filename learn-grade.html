<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse by Grade | STASHUNARY Learn</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#57237e,#160d2d 65%);font:16px/1.5 system-ui,Arial,sans-serif;color:white}main{max-width:1050px;margin:auto;padding:20px 18px 80px}a{color:inherit}.brand{font-size:clamp(22px,5vw,35px);font-weight:950;color:#ffe27b}.back{display:inline-block;margin:14px 0;color:#ffe4a5}.hero{background:linear-gradient(120deg,#7b2ec1,#db469a);border:3px solid #ffe078;border-radius:24px;text-align:center;padding:30px 15px;margin:18px 0}.hero h1{font-size:clamp(29px,6vw,48px);margin:8px 0}.hero p{font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tile{display:flex;min-height:195px;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fffaf1;border:4px solid #ffdd78;border-radius:20px;color:#45256a;padding:18px;text-decoration:none;box-shadow:0 10px 18px #0005;transition:transform .15s}.tile:hover,.tile:focus-visible{transform:translateY(-4px);outline:3px solid #ffdf74;outline-offset:3px}.tile .art{font-size:55px}.tile strong{font-size:20px}.tile small{color:#725d82;margin-top:8px}.notice{background:#f7e6ff;color:#3e215d;padding:18px;border-radius:15px;margin-top:24px}.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.book{background:#fffaf1;color:#47216a;padding:25px;border:3px solid #ffdf78;border-radius:20px;text-align:center}.book .art{font-size:70px}.book h2{margin:8px 0}.status{font-weight:850;color:#704f89}.resources{display:inline-block;margin-top:16px;color:#ffe6a0}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.langs{grid-template-columns:1fr}.tile{min-height:170px}}</style></head><body><main><div class="brand">👑 STASHUNARY Learn</div><a class="back" href="/learn.html">← Back to Learn</a><section class="hero"><div style="font-size:64px">🎒 📚 ✨</div><h1 id="title">Explore Your Grade</h1><p>Choose a subject to explore our learning library.</p></section><div class="grid" id="subjects"></div><div class="notice"><b>We're building our library!</b> Subjects are open for browsing, but workbook purchases and unfinished lessons are not available yet.</div><a class="resources" href="/learn-resources.html">Curriculum &amp; Resources / Plan de estudios y recursos →</a></main><script>const grades={"k":"Kindergarten","1":"1st Grade","2":"2nd Grade","3":"3rd Grade","4":"4th Grade","5":"5th Grade","6":"6th Grade","7":"7th Grade","8":"8th Grade"};const g=new URLSearchParams(location.search).get("grade");const grade=Object.hasOwn(grades,g)?g:"k";document.getElementById("title").textContent=grades[grade];document.title=grades[grade]+" | STASHUNARY Learn";const subjects=[["math","🔢","Math"],["reading","📖","Reading & Phonics"],["writing","✏️","Writing & Handwriting"],["science","🔬","Science & Discovery"],["social-studies","🌎","Social Studies"],["thinking","🧩","Thinking & Problem Solving"]];document.getElementById("subjects").innerHTML=subjects.map(([id,icon,name])=>'<a class="tile" href="/learn-subject.html?grade='+encodeURIComponent(grade)+'&subject='+encodeURIComponent(id)+'"><span class="art">'+icon+'</span><strong>'+name+'</strong><small>Explore workbooks →</small></a>').join("");</script></body></html>
