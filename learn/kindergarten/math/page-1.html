<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page 1 • STASHUNARY Learn</title><style>*{box-sizing:border-box}body{margin:0;background:#f1edff;font-family:system-ui,Arial,sans-serif;color:#221943}.wrap{max-width:650px;margin:auto;padding:20px 15px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:950;letter-spacing:.04em;color:#6b36c5}.home{color:#6536bd;text-decoration:none;font-weight:700}.panel{background:white;border-radius:26px;padding:24px 20px;box-shadow:0 8px 35px #47338a18;margin-top:18px}h1{font-size:clamp(28px,7vw,42px);margin:5px 0 10px}p{line-height:1.5}.tag{display:inline-block;background:#eee5ff;padding:7px 12px;border-radius:50px;font-size:13px;font-weight:800}.progress{height:10px;border-radius:20px;background:#ece6f6;overflow:hidden;margin:20px 0}.bar{height:100%;background:#7851d6;transition:width .2s}.question{text-align:center;font-weight:800}.objects{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;min-height:130px;align-items:center;padding:20px 5px}.dot{width:49px;height:49px;border-radius:50%;background:#ffbd36;border:3px solid #d98a00}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{font-size:34px;font-weight:900;border:3px solid #ddd5ef;background:white;border-radius:20px;padding:20px 0;color:#281b52;cursor:pointer}.choice:focus-visible{outline:4px solid #6745d1}.choice.correct{border-color:#1e9a64;background:#e4faed}.choice.wrong{border-color:#e27676;background:#fff0f0}.feedback{text-align:center;font-weight:800;min-height:32px;margin:18px 0}.next{width:100%;border:0;border-radius:15px;background:#7046c8;color:white;font-size:18px;font-weight:800;padding:17px;cursor:pointer}.next:disabled{background:#c7bfda;cursor:default}.footer{text-align:center;font-size:12px;color:#74688b;margin-top:20px}</style></head><body><main class="wrap"><div class="top"><div class="logo">STASHUNARY LEARN</div><a class="home" href="/learn.html">← Learn Home</a></div><section class="panel"><span class="tag">KINDERGARTEN MATH • PAGE 1</span><h1>Let's Count! 1–5</h1><p>Count the circles. Tap the number that tells how many you see.</p><div class="progress"><div class="bar" id="bar" style="width:0%"></div></div><div id="activity"><p class="question" id="question">Question 1 of 5</p><div class="objects" id="objects" aria-label="Counting circles"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>Next Question →</button></div></section><p class="footer">Learning should be challenging, but with understanding. • STASHUNARY Learn</p></main><script>const questions=[{n:2,opts:[1,2,3]},{n:4,opts:[3,4,5]},{n:1,opts:[1,2,4]},{n:5,opts:[3,4,5]},{n:3,opts:[2,3,5]}];let i=0;const el=id=>document.getElementById(id);function render(){const q=questions[i];el('bar').style.width=(i/5*100)+'%';el('question').textContent='Question '+(i+1)+' of 5';el('objects').innerHTML=Array.from({length:q.n},()=>'<span class="dot" aria-hidden="true"></span>').join('');el('objects').setAttribute('aria-label',q.n+' circles');el('choices').innerHTML='';el('feedback').textContent='';el('next').disabled=true;el('next').textContent=i===4?'Finish Page ✓':'Next Question →';q.opts.forEach(n=>{const b=document.createElement('button');b.className='choice';b.textContent=n;b.setAttribute('aria-label','Answer '+n);b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(n===q.n?'correct':'wrong');el('feedback').textContent=n===q.n?'✓ Great counting!':'Try again! Count each circle slowly.';el('next').disabled=n!==q.n};el('choices').appendChild(b)})}el('next').onclick=()=>{i++;if(i===5){el('bar').style.width='100%';el('activity').innerHTML='<div style="text-align:center;padding:40px 5px"><div style="font-size:56px">🏆</div><h2>Amazing counting!</h2><p>You finished all five questions!</p><button class="next" onclick="location.reload()">Play Again ↻</button></div>'}else render()};render();</script></body></html>
