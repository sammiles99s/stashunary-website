<script>
(function(){
  const bubble=document.querySelector('.ask-stash-float');
  if(!bubble)return;
  let startX=0,startY=0,baseX=0,baseY=0,dragging=false,moved=false,suppressClick=false;
  const margin=8;
  function clamp(x,y){
    const rect=bubble.getBoundingClientRect();
    return {x:Math.max(margin,Math.min(x,innerWidth-rect.width-margin)),y:Math.max(margin,Math.min(y,innerHeight-rect.height-margin))};
  }
  function place(x,y){const p=clamp(x,y);bubble.style.left=p.x+'px';bubble.style.top=p.y+'px';bubble.style.right='auto';bubble.style.bottom='auto';}
  bubble.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const r=bubble.getBoundingClientRect();
    startX=e.clientX;startY=e.clientY;baseX=r.left;baseY=r.top;
    dragging=true;moved=false;bubble.setPointerCapture(e.pointerId);
  });
  bubble.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(!moved&&Math.hypot(dx,dy)<7)return;
    moved=true;bubble.classList.add('dragging');place(baseX+dx,baseY+dy);
  });
  function finish(){if(!dragging)return;dragging=false;bubble.classList.remove('dragging');if(moved)suppressClick=true;}
  bubble.addEventListener('pointerup',finish);
  bubble.addEventListener('pointercancel',finish);
  bubble.addEventListener('click',e=>{if(suppressClick){e.preventDefault();suppressClick=false;}},true);
  addEventListener('resize',()=>{if(bubble.style.left)place(parseFloat(bubble.style.left),parseFloat(bubble.style.top));});
})();
</script></body></html>
