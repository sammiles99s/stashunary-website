<script>
(function(){
  const bubble=document.querySelector('.ask-stash-float');
  if(!bubble)return;
  let startX=0,startY=0,baseX=0,baseY=0,dragging=false,moved=false,suppressClick=false;
  const margin=8;
  function clamp(x,y){
    const rect=bubble.getBoundingClientRect();
    return {x:Math.max(margin,Math.min(x,innerWidth-rect.width-margin)),y:Math.max(margin,Math.min(y,innerHeight-rect.height-margin))};
  }
  function place(x,y){const p=clamp(x,y);bubble.style.left=p.x+'px';bubble.style.top=p.y+'px';bubble.style.right='auto';bubble.style.bottom='auto';}
  bubble.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const r=bubble.getBoundingClientRect();
    startX=e.clientX;startY=e.clientY;baseX=r.left;baseY=r.top;
    dragging=true;moved=false;bubble.setPointerCapture(e.pointerId);
  });
  bubble.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(!moved&&Math.hypot(dx,dy)<7)return;
    moved=true;bubble.classList.add('dragging');place(baseX+dx,baseY+dy);
  });
  function finish(){if(!dragging)return;dragging=false;bubble.classList.remove('dragging');if(moved)suppressClick=true;}
  bubble.addEventListener('pointerup',finish);
  bubble.addEventListener('pointercancel',finish);
  bubble.addEventListener('click',e=>{if(suppressClick){e.preventDefault();suppressClick=false;}},true);
  addEventListener('resize',()=>{if(bubble.style.left)place(parseFloat(bubble.style.left),parseFloat(bubble.style.top));});
})();
</script><script>
(()=>{const root=document.getElementById('milestone-visit-digits'),label=document.getElementById('milestone-visit-label');let current=null,visible=false;
function render(n){if(!Number.isSafeInteger(n)||n<0)return;const value=String(n).padStart(6,'0');root.replaceChildren(...[...value].map(c=>{const d=document.createElement('div');d.className='digit rolling';const s=document.createElement('span');s.textContent=c;d.append(s);return d}));label.textContent='VISITORS SINCE COUNTER LAUNCH';root.setAttribute('aria-label',n.toLocaleString()+' recorded visitors');current=n}
async function refresh(){try{const r=await fetch('/api/visits',{cache:'no-store'});if(!r.ok)throw Error('unavailable');const j=await r.json();if(Number.isSafeInteger(j.count)&&j.count>=0&&j.count!==current)render(j.count);else if(current===null)throw Error('invalid')}catch(e){if(current===null)label.textContent='OUR COMMUNITY IS GROWING!'}}
refresh();const obs=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){visible=true;obs.disconnect()}},{threshold:.15});obs.observe(root);setInterval(()=>{if(visible&&!document.hidden)refresh()},60000);
})();
